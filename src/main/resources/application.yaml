spring:
  application:
    name: user-service

  liquibase:
    change-log: classpath:liquibase/db.changelog-master.yaml
    enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/finance_tracker_user_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_USERNAME:postgres}

  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 15
        order_inserts: true
        order_updates: true
        query.fail_on_pagination_over_collection_fetch: true
        query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none

logging:
  level:
    spring: debug