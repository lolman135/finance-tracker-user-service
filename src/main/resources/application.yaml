spring:
  application:
    name: user-service
  config:
    import:
      - optional:file:.env
      - optional:file:../.env

  liquibase:
    change-log: classpath:liquibase/db.changelog-master.yaml
    enabled: true

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${USER_DB_URL}
    username: ${USER_DB_USERNAME}
    password: ${USER_DB_PASSWORD}

  jpa:
    show-sql: true
    open-in-view: false
    properties:
      hibernate:
        jdbc.time_zone: UTC
        jdbc.batch_size: 15
        order_inserts: true
        order_updates: true
        query.fail_on_pagination_over_collection_fetch: true
        query.in_clause_parameter_padding: true
    hibernate:
      ddl-auto: none

auth:
  jwt:
    access-token-ttl-sec: 86400
    secret-key: ${USER_API_KEY}


logging:
  level:
    spring: debug