databaseChangeLog:
  - changeSet:
      id: user-db
      author: kyrylo kusovskyi
      changes:
        - createTable:
            tableName: user_role
            columns:
              - column:
                  name: user_id
                  type: BIGINT
                  constraints:
                    nullable: false
              - column:
                  name: role_id
                  type: BIGINT
                  constraints:
                    nullable: false

        - addPrimaryKey:
              tableName: user_role
              columnNames: user_id, role_id
              constraintName: pk_user_id_role_id

        - addForeignKeyConstraint:
            baseTableName: user_role
            baseColumnNames: user_id
            referencedTableName: users
            referencedColumnNames: id
            constraintName: fk_user_role_user

        - addForeignKeyConstraint:
            baseTableName: user_role
            baseColumnNames: role_id
            referencedTableName: roles
            referencedColumnNames: id
            constraintName: fk_user_role_role

        - createIndex:
            tableName: user_role
            indexName: idx_user_role_role
            columns:
              - column:
                  name: role_id